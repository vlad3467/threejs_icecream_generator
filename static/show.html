<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Твоё мороженое! 🍦</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px 40px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        #error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
            z-index: 1000;
            background: rgba(255, 0, 0, 0.2);
            padding: 20px 40px;
            border-radius: 15px;
            border: 1px solid rgba(255, 0, 0, 0.5);
            display: none;
            backdrop-filter: blur(10px);
        }

        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 20px 25px;
            border-radius: 20px;
            z-index: 100;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 300px;
        }

        #info-panel h1 {
            font-size: 28px;
            margin: 0 0 15px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #info-panel .stats {
            margin: 10px 0;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
        }

        #info-panel .stat-item {
            margin: 5px 0;
            padding: 5px 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
        }

        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .back-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 14px;
            transition: background 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="loading">
        <span class="spinner"></span>
        Загружаем твоё мороженое...
    </div>

    <div id="error">
        😔 Не удалось загрузить мороженое
    </div>

    <div id="info-panel" style="display: none;">
        <h1>
            <span>🍦</span>
            Твоё мороженое!
        </h1>
        <div class="stats">
            <div class="stat-item">
                <span>Всего ингредиентов:</span>
                <strong id="total-count">0</strong>
            </div>
            <div class="stat-item">
                <span>Клубника:</span>
                <strong id="strawberry-count">0</strong>
            </div>
            <div class="stat-item">
                <span>Лимон:</span>
                <strong id="lemon-count">0</strong>
            </div>
            <div class="stat-item">
                <span>Шарики:</span>
                <strong id="ball-count">0</strong>
            </div>
        </div>
        <a href="/" class="back-btn">← Назад к игре</a>
    </div>

    <div id="controls-hint">
        Зум колесиком и зажимай для перемещения
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Получаем токен из URL
        const urlParts = window.location.pathname.split('/');
        const token = urlParts[urlParts.length - 1];

        // DOM элементы
        const loadingElement = document.getElementById('loading');
        const errorElement = document.getElementById('error');
        const infoPanel = document.getElementById('info-panel');

        // Инициализация Three.js
        const scene = new THREE.Scene();
        
        // Градиентный фон
        const canvas = document.createElement('canvas');
        canvas.width = 2;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        const gradient = ctx.createLinearGradient(0, 0, 0, 512);
        gradient.addColorStop(0, '#87CEEB');
        gradient.addColorStop(0.5, '#E0F7FA');
        gradient.addColorStop(1, '#B2EBF2');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 2, 512);
        const texture = new THREE.CanvasTexture(canvas);
        scene.background = texture;

        // Камера
        const camera = new THREE.PerspectiveCamera(
            45, 
            window.innerWidth / window.innerHeight, 
            0.1, 
            1000
        );
        camera.position.set(4, 2, 4);
        camera.lookAt(0, 0.5, 0);

        // Рендерер
        const renderer = new THREE.WebGLRenderer({ 
            antialias: true,
            alpha: true 
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // OrbitControls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0.5, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 2;
        controls.maxDistance = 10;
        controls.maxPolarAngle = Math.PI / 1.8;
        controls.update();

        // Освещение
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 10, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 50;
        dirLight.shadow.camera.left = -10;
        dirLight.shadow.camera.right = 10;
        dirLight.shadow.camera.top = 10;
        dirLight.shadow.camera.bottom = -10;
        scene.add(dirLight);

        dirLight.shadow.bias = -0.0001;
        dirLight.shadow.normalBias = 0.05;

        const pointLight1 = new THREE.PointLight(0xffaa00, 0.5);
        pointLight1.position.set(-3, 3, 3);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0x4488ff, 0.4);
        pointLight2.position.set(3, 2, -2);
        scene.add(pointLight2);

        // Пол
        const floorGeometry = new THREE.CircleGeometry(5, 64);
        const floorMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x90EE90,
            roughness: 0.8,
            metalness: 0.1
        });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -3;
        floor.receiveShadow = true;
        scene.add(floor);

        // Декоративные элементы
        const addDecorations = () => {
            // Облака
            for (let i = 0; i < 5; i++) {
                const cloudGroup = new THREE.Group();
                const cloudMat = new THREE.MeshStandardMaterial({ 
                    color: 0xffffff,
                    roughness: 1,
                    transparent: true,
                    opacity: 0.8
                });
                
                for (let j = 0; j < 3; j++) {
                    const cloudGeom = new THREE.SphereGeometry(0.3 + Math.random() * 0.3);
                    const cloudPart = new THREE.Mesh(cloudGeom, cloudMat);
                    cloudPart.position.set(
                        j * 0.4 - 0.4,
                        Math.random() * 0.2,
                        Math.random() * 0.3
                    );
                    cloudGroup.add(cloudPart);
                }
                
                cloudGroup.position.set(
                    (Math.random() - 0.5) * 6,
                    3 + Math.random() * 1,
                    (Math.random() - 0.5) * 4 - 2
                );
                scene.add(cloudGroup);
            }
        };
        addDecorations();

        // Загрузчик моделей
        const loader = new GLTFLoader();

        // Загрузка данных ингредиентов
        async function loadIngredientsData() {
            try {
                const response = await fetch(`/api/get-ingredients/${token}`);
                if (!response.ok) {
                    throw new Error('Ошибка загрузки данных');
                }
                const data = await response.json();
                return data.ingredients;
            } catch (error) {
                console.error('Ошибка:', error);
                return null;
            }
        }

        // Подсчет статистики
        function updateStats(ingredients) {
            const stats = {
                strawberry: 0,
                lemon: 0,
                ball: 0
            };
            
            ingredients.forEach(ingredient => {
                if (stats.hasOwnProperty(ingredient.type)) {
                    stats[ingredient.type]++;
                }
            });
            
            document.getElementById('total-count').textContent = ingredients.length;
            document.getElementById('strawberry-count').textContent = stats.strawberry;
            document.getElementById('lemon-count').textContent = stats.lemon;
            document.getElementById('ball-count').textContent = stats.ball;
        }

        // Основная функция загрузки и отображения
        async function init() {
            const ingredientsData = await loadIngredientsData();
            
            if (!ingredientsData || ingredientsData.length === 0) {
                loadingElement.style.display = 'none';
                errorElement.style.display = 'block';
                return;
            }

            // Загружаем базовый стаканчик
            loader.load('/models/basket.glb', 
                (gltf) => {
                    const basket = gltf.scene;
                    basket.position.set(0, -2, 0);
                    
                    basket.traverse(node => {
                        if (node.isMesh) {
                            node.castShadow = true;
                            node.receiveShadow = true;
                        }
                    });
                    
                    scene.add(basket);
                    
                    // Загружаем модели ингредиентов
                    const modelPaths = {
                        'ball': '/models/ball.glb',
                        'strawberry': '/models/strawberry.glb',
                        'lemon': '/models/lemon.glb'
                    };
                    
                    const loadedModels = {};
                    const typesToLoad = [...new Set(ingredientsData.map(i => i.type))];
                    
                    // Загружаем все необходимые модели
                    Promise.all(
                        typesToLoad.map(type => {
                            return new Promise((resolve, reject) => {
                                loader.load(modelPaths[type], 
                                    (gltf) => {
                                        loadedModels[type] = gltf.scene;
                                        resolve();
                                    },
                                    undefined,
                                    reject
                                );
                            });
                        })
                    ).then(() => {
                        // Размещаем ингредиенты
                        ingredientsData.forEach((ingredient, index) => {
                            if (!loadedModels[ingredient.type]) return;
                            
                            const model = loadedModels[ingredient.type].clone();
                            
                            // Устанавливаем позицию из сохраненных данных
                            model.position.set(
                                ingredient.position.x,
                                ingredient.position.y,
                                ingredient.position.z
                            );
                            
                            // Случайный поворот для естественности
                            model.rotation.set(
                                Math.random() * Math.PI * 2,
                                Math.random() * Math.PI * 2,
                                Math.random() * Math.PI * 2
                            );
                            
                            // Случайный размер (небольшая вариация)
                            const scale = 0.7 + Math.random() * 0.6;
                            model.scale.set(scale, scale, scale);
                            
                            model.traverse(node => {
                                if (node.isMesh) {
                                    node.castShadow = true;
                                    node.receiveShadow = true;
                                }
                            });
                            
                            basket.add(model);
                        });
                        
                        // Обновляем статистику
                        updateStats(ingredientsData);
                        
                        // Показываем панель информации
                        loadingElement.style.display = 'none';
                        infoPanel.style.display = 'block';
                        
                        console.log(`Загружено ${ingredientsData.length} ингредиентов`);
                    }).catch(error => {
                        console.error('Ошибка загрузки моделей ингредиентов:', error);
                        loadingElement.style.display = 'none';
                        errorElement.style.display = 'block';
                    });
                },
                undefined,
                (error) => {
                    console.error('Ошибка загрузки стаканчика:', error);
                    loadingElement.style.display = 'none';
                    errorElement.style.display = 'block';
                }
            );
        }

        // Анимация
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // Обработка изменения размера окна
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Запуск
        animate();
        init();
    </script>
</body>
</html>
